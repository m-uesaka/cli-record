version: '3'

vars:
  APP_NAME: cli-record
  BUILD_DIR: ./bin

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Install dependencies
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: Build the application with version information
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - |
        go build \
          -ldflags "-X 'github.com/m-uesaka/cli-record/cmd.Version=1.1.1' \
                    -X 'github.com/m-uesaka/cli-record/cmd.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)' \
                    -X 'github.com/m-uesaka/cli-record/cmd.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
          -o {{.BUILD_DIR}}/{{.APP_NAME}} .

  run:
    desc: Run the application
    cmds:
      - go run main.go {{.CLI_ARGS}}

  test:
    desc: Run tests
    cmds:
      - go test ./... -v

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test ./... -coverprofile=coverage.out
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  lint:
    desc: Run linter (requires golangci-lint)
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Run all checks (fmt, vet, test)
    cmds:
      - task: fmt
      - task: vet
      - task: test

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f coverage.out coverage.html

  install:
    desc: Install the application to $GOPATH/bin
    cmds:
      - |
        go install \
          -ldflags "-X 'github.com/m-uesaka/cli-record/cmd.Version=1.1.1' \
                    -X 'github.com/m-uesaka/cli-record/cmd.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)' \
                    -X 'github.com/m-uesaka/cli-record/cmd.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
          .
